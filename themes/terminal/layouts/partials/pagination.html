{{- if or .Paginator.HasPrev .Paginator.HasNext }}
<nav class="pagination" aria-label="Pagination">
  <div class="pagination__buttons">
    {{- if .Paginator.HasPrev }}
    <a href="{{ .Paginator.Prev.URL }}" rel="prev" class="button inline prev">&lt; [<span class="button__text">Newer posts</span>]</a>
    {{- end }}
    {{- if .Paginator.HasNext }}
    <a href="{{ .Paginator.Next.URL }}" rel="next" class="button inline next">[<span class="button__text">Older posts</span>] &gt;</a>
    {{- end }}
  </div>
</nav>
{{- end }}
