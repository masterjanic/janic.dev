<header class="header">
  <div class="header__inner">
    <div class="header__logo">{{ partial "logo.html" . }}</div>
  </div>
  <nav class="navigation-menu" aria-label="Main">
    <ul class="navigation-menu__inner">
      {{- $current := . -}}
      {{- range site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
</header>
